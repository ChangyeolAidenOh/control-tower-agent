meta:
  title: SCM Control Tower 의사결정 지원 파이프라인 — 파일럿 완료 보고
  date: 2026-10
  font: Malgun Gothic
  naming: LLM 인터페이스를 가진 의사결정 지원 파이프라인
  files:
    s5: outputs/deck/s5_agg.json
    confirmatory: outputs/stage6_confirmatory.json
  rules:
  - H3 단독 인용 금지 — CSL −4.7pp 병기 (S1, S6)
  - H5 보조 통계(76.7%, +15.69)는 부록 전용, 판정 비사용 라벨
  - H1 PASS는 3단계 수용 전 r 기각과 동반 제시
  - 'CSL 라벨: §5 표 = 에피소드 평균 / 차트·집계 = pooled SKU-일'
  - 비용 단위 = 시뮬레이터 비용 단위(설정 비용함수 기준), 금액 환산 금지
  - 'ΔWC·자본효과(USD)는 γ·k 명시 가정 조건부(A5 전용) — 시뮬레이터 비용의 금액 환산 금지는 유지, 통화는 재고 브리지 경유만'
slides:
- id: S1
  kicker: Executive Summary
  layout: stat_cards
  title: 비용 개선은 확인했으나, 서비스 기준과 LLM 우위는 입증하지 못했다
  headline: 승인 흐름 기반 의사결정 시스템의 비용 개선 가능성을 확인했지만, 서비스 수준 가드레일과 LLM 후보 생성 우위는 충족하지 못했다. 따라서 현재 단계의 권고는 자율 발주 승격이 아닌 사람 승인 기반의 의사결정 지원이다.
  stats:
  - label: H3 · L0 대비 비용 차이
    value:
      frozen: '+240.66'
      source: docs/agent_h3h5_report.md
    sub:
      frozen: 단측 95% 하한 +205.73 · 서비스 −4.7%p 동반
      source: docs/agent_h3h5_report.md
    tone: ok
  - label: 서비스 수준 변화 (Agent − L0)
    value:
      frozen: −4.7%p
      source: docs/agent_h3h5_report.md
    sub:
      frozen: 운영 승격의 핵심 제약
      source: outline S1
    tone: warn
  - label: H5 · LLM strict-win
    value:
      frozen: 43.96%
      source: docs/agent_h3h5_report.md
    sub:
      frozen: 사전등록 기준 50% 미달 (211/480)
      source: docs/agent_h3h5_report.md
    tone: warn
  sources:
  - docs/agent_h3h5_report.md
  - docs/agent_stage_report.md
- id: S2
  kicker: Decision Scope
  layout: definition
  title: 어떤 결정을 다루는가
  headline: 대상 결정과 담당·승인권자·가능/금지 조치를 분석 전에 고정했다.
  statement: DC 공유 용량(K_g) 하 일별 발주량 — 28일 롤링 중 첫날만 실행
  rows:
  - - 대상
    - 154 SKU · 10묶음 (M5 CPG 서브셋, 사전등록 v2)
  - - 주기
    - 일별 발주, 28-day rolling의 first day만 집행
  - - 제약
    - 묶음(state × dept)별 공유 발주 용량 K_g, κ = 1.0
  - - 담당
    - 계획 담당 = 승인점 ① / DC 관리자 = 승인점 ②
  - - 범위 외 조치
    - 재고 이동 · 긴급 발주 (이번 파일럿 범위 외)
  - - 미확정 가정
    - 고객 미확정 파라미터는 '첫 미팅 확인 질문'으로 별도 관리
  sources:
  - docs/decision_definition.md §0–§3
- id: S3
  kicker: AS-IS → To-Be
  layout: before_after_band
  title: 수작업 예외 처리에서 승인 흐름으로
  headline: 에이전트는 3개 단계를 대체하고, 사람은 행동공간 정의와 승인점 ①②, 실행·롤백을 유지한다.
  asis_steps:
  - 예외 감지
  - 근거 수집
  - 대안 계산
  - 승인 요청
  - 실행
  - 사후 추적
  agent_steps:
  - 1
  - 3
  - 5
  approval_steps:
  - 3
  - 4
  legend: 주황 = 에이전트 대체 구간  ·  굵은 테두리 = 사람 승인점 ①②
  panels:
  - name: 에이전트가 대체
    tone: agent
    items:
    - 근거 수집 — 수요·재고·제약 근거 자동 취합
    - 승인 요청 초안 — 후보·게이트 결과·설명 생성
    - 사후 추적 — 채택 후 결과 기록
  - name: 사람이 유지
    tone: ink
    items:
    - 행동공간 정의 (조치 계약)
    - 승인점 ① 계획 담당 · ② DC 관리자
    - 실행 · 롤백 / L1 vs L2 차이는 승인 단계 1곳
  sources:
  - docs/asis_decision_journey.md §1–§2
  - docs/decision_definition.md §4
- id: S4
  kicker: Acceptance Criteria
  layout: criteria
  title: 수용 기준 — 결과를 보기 전에 동결
  headline: preregistration v1.2 (동결 2026-10-08, 독립 리뷰 3회) — δ·floor는 고객 미확정 파라미터로 [가정] 표기 유지.
  layers:
  - name: L1 · 통계 비열등
    text: CSL 비열등성, 마진 δ = 1%p — 이동 블록 부트스트랩 판정
  - name: L2 · 하드 가드레일
    text: 번들×주 CSL 90% floor — 위반 권고는 자동 차단 (게이트)
  tiers:
  - - 채택 검토
    - L1 통과 + L2 위반 없음
  - - 조건부 채택
    - L1 통과 + L2 위반 존재 — 차단 범위 한정 운영
  - - 기각
    - L1 미달
  sources:
  - docs/decision_definition.md §6
  - docs/preregistration.md v1.2
- id: S5
  kicker: Alternatives
  layout: scatter_chart
  title: 비용–서비스 수준 비교 (r=5)
  headline: 동일한 수요·비용 환경에서도 정책별 균형점이 달랐으며, 비용 절감이 곧 운영 승격 가능성을 의미하지는 않았다.
  chart:
    points_ref: s5:policies
    frontier_ref: s5:frontier_operational
    agent_ref: s5:agent
    reference_policies_ref: s5:reference_policies
    hline:
      y: 0.9
      label: CSL 90% (참고)
  talk_notes:
  - B(순수 비용 DFL)는 프런티어 밖 — A1에 지배됨 (사전등록 비교 대상이 아니므로 H1 판정과는 별개)
  - Agent는 A-PTO에 지배되지만, 운영 기준선 A4 대비 서비스 +1.4%p (비용 +16.4)
  - 규칙 개선(A4-SL)만으로도 L0 대비 비용·서비스 동시 개선 — 에이전트가 유일한 해법은 아님
  footnotes:
  - '프런티어·지배 관계는 점추정 기술통계 — 통계적 판정은 사전등록 비교(H1: A2·A3·A4 / H1-b: A-PTO / H3: L0 vs Agent)에만 존재'
  - Agent는 단일 LLM 실행 경로, A5는 완전정보 참고 정책 — 둘 다 프런티어 계산 제외 · 90% 선은 참고 기준이며 개별 주차 게이트 통과를 뜻하지 않음
  sources:
  - outputs/deck/s5_agg.json (ST8-01/02)
  - docs/asis_diagnosis.md
- id: S6
  kicker: Pilot Results 1/2
  layout: judgment_matrix
  title: H1 · H3 — 비용 절감은 서비스 저하를 동반했다
  headline: 순수 비용 DFL(B)은 비용 기준 통과(r3·r5)에도 최종 수용은 전 r 기각 — 승인 흐름 에이전트(H3)에서도 같은 구조가 반복됐다.
  matrix_frozen_rows:
  - - H1-SL (δ=1%p)
    - FAIL
    - FAIL
    - FAIL
  - - 3단계 수용 (정의서 §6)
    - 기각(L1)
    - 기각(L1)
    - 기각(1차)
  matrix_note:
    frozen: H1-SL 전 r FAIL — B의 CSL 0.589–0.655 (에피소드 평균 CSL 기준)
    source: stage6_report.md §4–§5
  h3_card:
    title: H3 · 승인 흐름 vs L0 (r=5, 쌍별 480)
    lines:
    - frozen: 비용 차이 +240.66 · 단측 95% 하한 +205.73 → PASS
      source: docs/agent_h3h5_report.md
    - frozen: 서비스 −4.7%p [−5.30, −4.23] 동반 — 비용과 서비스를 함께 보고
      source: docs/agent_h3h5_report.md
    - frozen: '원인: 비용만 최적화한 학습이 과소 발주를 유도 (용량 소진 218일 vs 완전정보 기준 4,360일)'
      source: stage6_report.md §7
  sources:
  - outputs/stage6_confirmatory.json
  - docs/stage6_report.md
  - docs/agent_h3h5_report.md
- id: S7
  kicker: Pilot Results 2/2
  layout: h5_breakdown
  title: H5 실패 분석 — 동결한 판정 규칙을 그대로 적용했다
  headline: strict-win 211/480 = 43.96% < 50% → FAIL. 판정 규칙은 결과 확인 전에 동결(ST7-09)했고, 결과를 본 뒤 바꾸지 않았다.
  segments:
  - label: 승 211
    n: 211
    tone: ok
  - label: 동률 205
    n: 205
    tone: muted
    sub: both-fallback 120 포함
  - label: 패 64
    n: 64
    tone: warn
  threshold_note: '통과 기준: 241승 이상 (과반)'
  beats:
  - - 판정 사실
    - - 승 211 / 동률 205 / 패 64
      - 과반 기준 241에 미달하여 FAIL
  - - 동률 분석
    - - 미달의 지배 요인은 동률 42.7% — 그중 120주는 양쪽 모두 전 후보가 게이트에서 거절되어 결과가 완전히 동일
      - 동률을 승리로 치지 않는 보수적 규칙을 결과 확인 전에 정했고, 사후 변경하지 않았다
  - - 결론
    - - 가치의 중심은 후보 생성 우위가 아니라 승인 흐름 전체(H3)와 설명·인터페이스
      - '재정의: LLM 인터페이스를 가진 의사결정 지원 파이프라인'
  sources:
  - docs/agent_stage_report.md §3–§4
  - agent_h5_common_state.json
- id: S8
  kicker: Recommendation
  layout: grid_2x2
  title: 권고와 다음 단계
  headline: L2(승인형) 승격 보류 — 사람 승인 기반 의사결정 지원(L1) 유지.
  panels:
  - name: 권고
    tone: ink
    items:
    - 자율 발주 승격이 아닌 사람 승인 기반 의사결정 지원
    - 가드레일 미충족 상태의 승격 보류 — 승인점 ①② 유지
  - name: 후속 설계
    tone: accent
    items:
    - '서비스 제약을 설계에 내장: τ 하한 · CSL 페널티'
    - SL 제약 선정 규칙(A4-SL 방식)을 에이전트 조치 공간에 반영
  - name: 비즈니스 케이스 경계 (Stage 8)
    tone: muted
    items:
    - 관측값 / 시뮬레이션 결과 / 향후 검증할 비즈니스 가정 — 3분할
    - '관측 수치·재무 브리지·조건부 시나리오는 부록 A5 요약 · 상세 docs/business_case.md (ST8-10)'
  - name: 자율성 로드맵
    tone: muted
    items:
    - 'L1→L2 승격: 4주 연속 권고 비용 ≤ 기준선 + 시간 블록 신뢰 하한 > 0'
    - '강등: 1주라도 상한 초과 시 즉시 / L3는 문서 검토 단계로만 유지'
  sources:
  - plan v1.3 §4.7·§4.9
  - docs/maturity_checklist.md
  - docs/agent_stage_report.md §5
- id: A1
  kicker: Appendix
  layout: grid_2x2
  title: 'A1 — 설계 근거: L-M-E-K · 아키텍처 · 게이트'
  panels:
  - name: L-M-E-K (공개 프레임 근거 조작적 정의)
    tone: accent
    items:
    - Lever = 고객이 조정 가능한 비즈니스 변수
    - DFL · ACI · LLM은 Enabler로 분류 (Lever 아님)
    - Mechanism 7개 중 5개는 사전등록으로 검증, 2개는 가설 수준으로 구분 표기
  - name: 조치 공간
    tone: ink
    items:
    - τ 격자 5점 + SKU 발주 승수 ≤ 10
    - '실행 순서: τ′ → A4 → 승수 → 용량 게이트'
    - 주당 1회, 후보 상한 20/에피소드 (양군 동일)
  - name: 선정·게이트
    tone: ink
    items:
    - '선정: A3 9-분위수 시나리오 × 10일 시뮬레이션'
    - '게이트: raw 용량 거절 + 7일 CSL 중앙값 0.90 차단'
  - name: fallback
    tone: muted
    items:
    - 전 후보 거절 시 무조치 A4로 복귀
    - 안전성 보증이 아닌 운영 안전장치
  sources:
  - docs/lmek_model.md v2
  - docs/agent_stage_report.md §1
- id: A2
  kicker: Appendix
  layout: grid_2x2
  title: 'A2 — 무결성: 결과 열람 통제 · 검증 게이트 · 재현'
  panels:
  - name: 결과 열람 통제 타임라인
    tone: accent
    items:
    - LLM 설정 동결(payload sha 98c23b07278c) → 스모크 테스트(기술 검증만, 성능 미열람)
    - 공식 양군 480주 실행 → 판정 규칙 동결(결과 확인 전) → 동시 공개
    - 오프라인 재생 검증 480/480 일치
  - name: 덱 검증 사이클 (ST8-01/02)
    tone: ink
    items:
    - 'V1: 정책 명칭 불일치 적발 (l0 vs l0_rule_ct)'
    - 'V4a: 보고서 표 통계 식별 — 에피소드 평균과 pooled CSL 분리'
    - 'V4b: 실행 환경 차이 재확인 (L0 −8.77, 기록된 드리프트와 일치)'
  - name: 재현
    tone: muted
    items:
    - 재현 커맨드 7종 + 덱 집계(scripts/build_deck_s5_agg.py)
    - 판정 근거 JSON 전부 sha 동결
  - name: LLM군 재현 등급
    tone: muted
    items:
    - 완전 동일 재현이 아닌 계약 수준 재현
    - 동결 설정 · 원시 응답 보관 · sha 추적
  sources:
  - handoff v1.9 §2–§3
  - outputs/deck/s5_agg.json
  - docs/agent_stage_report.md §6
- id: A3
  kicker: Appendix
  layout: grid_2x2
  title: A3 — H5 보조 통계 (판정 비사용)
  panels:
  - name: 보조 비교 — 전부 판정 비사용
    tone: accent
    items:
    - 동률 제외 시 조건부 승률 76.7%
    - '실현 28일 비용 보조 비교: LLM이 평균 15.69 낮음 (209/480 우위 · 134 동일)'
  - name: 기각 구성 차이
    tone: ink
    items:
    - 'LLM: 용량 거절 42.2% · 서비스 거절 31.1% (공격적 증량 제안 경향)'
    - '수치군: 용량 25.3% · 서비스 48.5% (무작위 감량이 서비스 게이트에 걸림)'
  - name: 운영 — LLM군
    tone: muted
    items:
    - 지출 $1.1032 (상한 $10) · 기술 오류 0
    - 적법률 99.76% · 선택시간 중앙값 13.06s
  - name: 운영 — 수치군
    tone: muted
    items:
    - 시간 상한 13.06s 미발동 (중앙값 1.04s)
    - fallback 30.6% vs LLM 27.1%
  sources:
  - docs/agent_stage_report.md §2–§3
  - agent_llm_official.json
  - agent_numeric_official.json
- id: A4
  kicker: Appendix
  layout: grid_2x2
  title: A4 — 한계
  panels:
  - name: 에이전트 평가
    tone: warn
    items:
    - 에이전트 결과는 단일 LLM 실행 경로 기준 — 타 모델·제공자로 일반화 불가
    - 비교군(균등 무작위)은 탐색의 하한선 — 고도화 탐색 대비 우위 주장 아님
    - 후보 선정 시나리오는 본평가와 동일한 분위수 시나리오를 재사용 (재선정 없음)
  - name: 서비스
    tone: warn
    items:
    - 서비스 −4.7%p — 서비스 제약을 결합한 설계는 후속 과제
    - 설명 생성 15건이 길이 제한으로 잘림 (조치·판정에는 영향 없음)
  - name: H1 · A-PTO
    tone: muted
    items:
    - 'H1: 정책별 학습 정보량 차이 / 초기 상태에 검증 구간 정보 재사용 / 학습 손실 ≠ 운영 비용'
    - 'A-PTO: 시간 예산 내 13/27 trial 탐색 / GPU 이전은 산출물 sha 동결로 재현성 대체 / 안전재고 보정이 검증 구간과 중첩'
  - name: 범위
    tone: muted
    items:
    - 모든 성과는 시뮬레이션 환경 내 측정값 — 실제 운영 데이터 검증 미수행
    - 결론 범위는 안정 회전 CPG 154 SKU · 10묶음에 한정 / 수요가 정책과 무관하게 관측된다는 가정 하 성립
  sources:
  - docs/agent_stage_report.md §5
  - docs/stage6_report.md §8
- id: A5
  kicker: Appendix
  layout: grid_2x2
  title: 'A5 — 비즈니스 케이스: 계산 경계 3분할 요약 (상세 docs/business_case.md)'
  panels:
  - name: 관측 — L0 → Agent (r=5, 480ep, 동결 산출물)
    tone: accent
    items:
    - frozen: '비용 −240.66/ep (−18.77%) = 보유 −403.73 + 결품 +182.67 + 터미널 −19.59 — 절감은 전액 보유비, 결품비는 증가'
      source: stage8_lagging_metrics.json
    - frozen: 'pooled CSL −4.73%p · 수량 결품률 +6.15%p (≈ 미충족 +3.85단위/묶음·일)'
      source: stage8_lagging_metrics.json
    - frozen: 'DOI(on-hand) 1.96 → 1.26일 (−35.6%) · in-transit −0.29일(별도) · 총 포지션 −0.99일'
      source: stage8_lagging_metrics.json
  - name: 재무 브리지 (관측 → 가정의 교량)
    tone: ink
    items:
    - frozen: '항등식: 판매가 평가 재고자산 = 일평균 보유비용 / ρ (h_i = ρ·p̄_i, ρ = 0.401871 — 합성 비용 계수)'
      source: docs/business_case.md §4
    - frozen: '판매가 평가 on-hand: L0 333.6 → Agent 190.1 USD/묶음, Δ 143.5 (서브셋 10묶음 1,435)'
      source: stage8_lagging_metrics.json financial_bridge
    - frozen: '검산: 내재 평균단가 2.71 ≈ p̄ 중앙값 2.49 · in-transit은 소유권 가정 전 제외'
      source: docs/business_case.md §4
  - name: 조건부 재무 시나리오 — 전부 [가정]
    tone: muted
    items:
    - frozen: '[가정] ΔWC(γ) = γ × 1,435 USD — γ ∈ {0.5, 0.6, 0.7} → 718 / 861 / 1,005 (일회성, 서브셋)'
      source: docs/business_case.md §5.1
    - frozen: '[가정] 연간 자본효과 = ΔWC × k — 예: γ=0.6, k=0.10 → 86 USD/년 (서브셋)'
      source: docs/business_case.md §5.2
    - frozen: '전사 확장은 비례 계수 S 명시 후에만 — 본 덱은 서브셋 수치만 제시, 규모가 아닌 환산 구조가 목적'
      source: docs/business_case.md §3·§5
  - name: 금지 규칙 · 산출 불가 · 파일럿 입력
    tone: warn
    items:
